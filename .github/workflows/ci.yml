name: Windows CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project and checks
        run: python -m pip install ".[dev]"

      - name: Tests
        run: python -m pytest -q

      - name: Ruff
        run: python -m ruff check .

      - name: Compile Python sources
        shell: pwsh
        run: |
          $pyFiles = git ls-files '*.py'
          python -m py_compile $pyFiles

      - name: Bandit
        run: python -m bandit -q -ll -r berangaria_agent

      - name: Dependency audit
        run: python -m pip_audit -r requirements.txt --progress-spinner off

      - name: Windows launcher smoke test
        shell: cmd
        run: call start-agent.bat --help

      - name: Build package
        run: python -m build
